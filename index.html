<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#0a0608" />
    <title>Ballistocracy</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0a0608; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
      #game { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #game canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
      #ui { position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%); z-index: 10; font-family: 'Courier New', monospace; }
      #ui .panel { background: #000c; border: 3px solid #f0c020; padding: 10px 16px; color: #f0e0a0; text-align: center; letter-spacing: 2px; box-shadow: 4px 4px 0 #702010; }
      #ui .key { font-size: 34px; font-weight: bold; color: #ffe040; margin: 6px 0; letter-spacing: 8px; }
      #ui input { font: bold 26px 'Courier New', monospace; width: 190px; text-transform: uppercase; text-align: center; letter-spacing: 6px; background: #1a1010; color: #ffe040; border: 2px solid #f0c020; margin: 8px; padding: 4px; }
      #ui button { font: bold 16px 'Courier New', monospace; background: #c02020; color: #fff; border: 2px solid #fff; padding: 6px 16px; cursor: pointer; letter-spacing: 2px; }
      #ui button:hover { background: #e04040; }
      #ui .err { color: #ff6060; margin-top: 6px; }
      #editor-ui { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
        padding: 4px 6px; background: #120c10e8; border-bottom: 2px solid #f0c020; font: bold 12px 'Courier New', monospace; color: #f0e0a0; }
      #editor-ui input, #editor-ui select { font: bold 12px 'Courier New', monospace; background: #1a1010; color: #ffe040; border: 1px solid #f0c020; padding: 2px 4px; }
      #editor-ui button { font: bold 11px 'Courier New', monospace; background: #c02020; color: #fff; border: 1px solid #fff; padding: 3px 7px; cursor: pointer; }
      #editor-ui button:hover { background: #e04040; }
      #editor-ui .status { flex-basis: 100%; font-size: 11px; color: #a0e0a0; }
      #touch-ui { position: fixed; inset: 0; z-index: 15; pointer-events: none; font-family: 'Courier New', monospace; }
      #touch-ui .zone-left { position: absolute; left: 0; top: 15%; width: 45%; bottom: 0; pointer-events: auto; touch-action: none; }
      #touch-ui .stick-base { position: absolute; width: 104px; height: 104px; margin: -52px 0 0 -52px; border-radius: 50%; border: 3px solid #ffffff40; background: #00000030; opacity: 0; pointer-events: none; }
      #touch-ui .stick-base.active { opacity: 1; }
      #touch-ui .stick-knob { position: absolute; left: 30px; top: 30px; width: 44px; height: 44px; border-radius: 50%; background: #f0c020b0; border: 2px solid #fff8; }
      #touch-ui button { pointer-events: auto; touch-action: none; position: absolute; border-radius: 50%; border: 3px solid #ffffff90; color: #fff; font: bold 13px 'Courier New', monospace; background: #00000055; -webkit-tap-highlight-color: transparent; }
      #touch-ui button.on { background: #ffffff70; transform: scale(0.94); }
      #touch-ui .btns { position: absolute; right: max(12px, env(safe-area-inset-right)); bottom: 14px; width: 210px; height: 190px; pointer-events: none; }
      #touch-ui .b-jump { right: 0; bottom: 0; width: 86px; height: 86px; background: #2a8a3a80; }
      #touch-ui .b-fire { right: 98px; bottom: 6px; width: 78px; height: 78px; background: #c0302080; }
      #touch-ui .aim-arrow { display: none; position: absolute; left: 50%; top: 50%; width: 64px; height: 4px; margin-top: -2px; transform-origin: 0 50%; pointer-events: none; background: linear-gradient(90deg, #ffe04000, #ffe040); }
      #touch-ui .aim-arrow::after { content: ''; position: absolute; right: -8px; top: -5px; border-left: 10px solid #ffe040; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
      #touch-ui .b-special { right: 8px; bottom: 100px; width: 64px; height: 64px; background: #d0802080; }
      #touch-ui .b-interact { right: 92px; bottom: 100px; width: 58px; height: 58px; background: #3060c080; font-size: 11px; }
      #touch-ui .b-start { left: 50%; transform: translateX(-50%); bottom: max(22%, env(safe-area-inset-bottom)); width: auto; height: 40px; padding: 0 26px; border-radius: 8px; background: #f0c020d0; color: #120c10; font-size: 16px; letter-spacing: 2px; }
      #touch-ui .b-start.on { transform: translateX(-50%) scale(0.94); }
      #touch-ui .sys { position: absolute; right: 12px; top: 15%; display: flex; gap: 10px; pointer-events: none; }
      #touch-ui .sys button { position: static; width: 34px; height: 34px; padding: 0; border-radius: 8px; border-width: 2px; background: #00000070; display: flex; align-items: center; justify-content: center; }
      #touch-ui .sys svg { width: 16px; height: 16px; fill: #fff; stroke: #fff; }
      #touch-ui .sys .b-full svg { fill: none; }
      #rotate-hint { display: none; position: fixed; inset: 0; z-index: 50; background: #0a0608; color: #f0c020; font: bold 20px 'Courier New', monospace; align-items: center; justify-content: center; text-align: center; padding: 20px; }
      @media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="rotate-hint">ROTATE YOUR DEVICE<br />TO LANDSCAPE</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
